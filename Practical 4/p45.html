<html>
<head>
    <title>p45</title>
</head>
<body bgcolor="#E3DAC9">

    <p align="right">Student Registration Form</p>
    <h1>Practical 4.5</h1>
    <form>
        <table>
                <tr>
                    <th align="left">First Name:</th>
                    <th align="left"><input type="text" id="firstName" placeholder="Enter your first name"></th>
                </tr>
                <tr>
                    <th align="left">Last Name:</th>
                    <th align="left"><input type="text" id="lastName" placeholder="Enter your last name"></th>
                </tr>
                <tr>
                    <th align="left">Email:</th>
                    <th align="left"><input type="email" id="email" placeholder="should contain @"></th>
                </tr>
                <tr>
                    <th align="left">Mobile:</th>
                    <th align="left"><input type="number" id="mobile" placeholder="only 10 digits are allowed"></th>
                </tr>
                <tr>
                    <th colspan="2" align="left">
                        Gender:
                            <input type="radio" id="male" name="gender" value="male">
                            <label for="male">Male</label>
                            <input type="radio" id="female" name="gender" value="female">
                            <label for="female">Female</label>
                    </th>
                </tr>
                <tr>
                    <th align="left">Date Of Birth:</th>
                    <th align="left"><input type="date" id="dob"></th>
                </tr>
                <tr>
                    <th align="left">Address:</th>
                    <th align="left"><textarea id="address" rows="5" cols="50"></textarea></th>
                </tr>
                <tr>
                    <th align="left">City:</th>
                    <th align="left"><input type="text" id="city"></th>
                </tr>
                <tr>
                    <th align="left">Area PIN:</th>
                    <th align="left"><input type="number" id="pin"></th>
                </tr>
                <tr>
                    <th align="left">State:</th>
                    <th align="left"><input type="text" id="state"></th>
                </tr>
                <tr>
                    <th align="left">Qualification:</th>
                    <th align="left">
                        <select id="qualification">
                        <option value=""disabled selected>Select Qualification</option>
                        <option value="10th">10th pass</option>
                        <option value="10+2">10+2 pass</option>
                        <option value="diploma">Diploma</option>
                        </select>
                    </th>
                </tr>
                <tr>
                    <th align="left">Specialization:</th>
                </tr>
                <tr>
                    <th align="left" colspan="2">
                        <input type="checkbox" id="cs" name="specialization" value="cs">
                            <label for="cs">Computer Science</label><br>
                            <input type="checkbox" id="it" name="specialization" value="it">
                            <label for="it">Information Technology</label><br>
                            <input type="checkbox" id="ca" name="specialization" value="ca">
                            <label for="ca">Computer Architecture</label><br>
                            <input type="checkbox" id="tc" name="specialization" value="tc">
                            <label for="tc">Tele Communication</label>
                    </th>
                </tr>
                <tr>
                    <th align="left">Password:</th>
                    <th align="left"><input type="password" id="password"></th>
                </tr>
                <tr>
                    <th align="left"><button type="submit">Registered</button></th>
                </tr>
        </table>
    </form>
</body>
</html>
