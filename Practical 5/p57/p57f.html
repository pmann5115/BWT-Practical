<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical 5.7f</title>
    <style>
        #indent{
            text-indent: 50px;
        }

        #line{
            line-height: 1.8;
        }

        #letter{
            letter-spacing: 5px;
        }

        #word{
            word-spacing: 10px;
        }
    </style>
</head>
<body>
    <p id="indent">Text Indent</p>
    <p id="line">Line Height</p>
    <p id="letter">Letter Spacing</p>
    <p id="word">Word Spacing</p>
</body>
</html>
