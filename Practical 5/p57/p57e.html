<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical 5.7e</title>
    <style>
        div{
            border: 3px solid  rgb(241, 37, 85);
            width: fit-content;
            background-color: rgb(241, 37, 85);
        }

        p.capitalize{
            text-transform: capitalize;
        }

        p.uppercase{
            text-transform: uppercase;
        }

        p.lowercase{
            text-transform: lowercase;
        }
    </style>
</head>

<body>
    <div>
        <p class="capitalize">the first letter of each word is uppercased</p>
        <p class="uppercase">all characters are transformed to uppercase</p>
        <p class="lowercase">TRANSFORMS ALL CHARACTER TO LOWERCASE </p>
    </div>
</body>

</html>
