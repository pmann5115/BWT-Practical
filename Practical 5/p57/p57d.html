<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical 5.7d
    </title>
    <style>
        #red{
            text-decoration: underline;
            text-decoration-color: red;
        }
        
        #RGB{
            text-decoration: underline;
            text-decoration-color: rgb(23,199,87);
        }
        
        #Hexadecimal{
            text-decoration: underline;
            text-decoration-color: #4525f5;
        }
        
        #HSL{
            text-decoration: underline;
            text-decoration-color: hsl(300,100%,80%) ;
        }
        
    </style>
</head>
<body>
    <h1>Text Decoration Color</h1>
    <p id="red">Color name- red</p>
    <p id="RGB">rgb(23,199,87)</p>
    <p id="Hexadecimal">#4525f5</p>
    <p id="HSL">hsl(300,100%,80%)</p>
</body>
</html>
