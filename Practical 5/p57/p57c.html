<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical 5.7c</title>
    <style>
        div{
            border: 3px solid red;
            width: fit-content;
        }

        #Length{
            text-decoration: underline;
            text-decoration-thickness: 2.5px;
        }

        #Percentage{
            text-decoration: underline;
            text-decoration-thickness: 150%;
        }
    </style>
</head>
<body>
        <h1>Text-Decoration-Thickness</h1>
        <p id="Length">Length 2.5px</p>
        <p id="Percentage">Percentage 150%</p>
</body>
</html>
